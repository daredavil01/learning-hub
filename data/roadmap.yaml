# The About page.
about:
  intro: In 60 days, become interview-ready for senior AI roles at product companies and GCCs. The target role blends Applied AI / LLM Engineer, GenAI Solutions Architect and Data + AI Platform Architect.
  constraints:
    - { label: Time, value: "2 h weekdays, 3–4 h weekends ≈ 17 h/week ≈ 145 h total" }
    - { label: Budget, value: "At most $20/month for LLM APIs and cloud" }
    - { label: Output, value: "Four upgraded portfolio projects and this public, forkable hub" }
    - { label: Fixed date, value: "Khadakwasla Ultra on day 56; days 55–56 are rest" }
  tracks:
    learn: One lecture, chapter, essay or course module at a time. Finish the Must resources; use the rest as references.
    build: One project at a time. Build carries the most weight, because product-company interviews probe what you shipped and measured.
    interview: System design, low-level design, a little DSA, mocks and a bank of STAR stories.
  rhythm:
    weekdays:
      - "50 min learn: one lecture, chapter, essay or course module"
      - "55 min build. On Tue and Thu, 30 of these minutes go to DSA"
      - "15 min capture: log what you learned in the hub"
    weekends:
      - 2–2.5 h deep build block
      - "45 min interview practice: one design or LLD problem, written up in the hub"
      - "30 min weekly review: update progress, read your 3–4 sources, write a short weekly note"

# Phases in day order. The entry with race: true can be skipped per user;
# the phase before it then runs to the race's last day.
# Build details: project (a projects id), build_steps (ordered, tickable; append new steps
# at the end so saved ticks keep matching) and build_links (references for the build).
weeks:
  - id: w1
    number: 1
    short: W1
    start: 1
    end: 7
    title: How LLMs work + APIs
    learn: Tokens, attention, sampling, context windows; LLM APIs
    build: Learning hub v0, timeboxed to 6 h
    build_sub: Astro, roadmap.yaml, lychee link checks, Cloudflare deploy
    interview: OOP and SOLID; DSA arrays and hashing
    dsa: arrays and hashing
    build_steps:
      - Scaffold Astro with one React island; add the Organic design system styles
      - Seed data/roadmap.yaml from the plan (weeks, resources, checkpoints) and validate it with Zod at build time
      - "Create a Supabase project: progress table with row-level security, email + password sign-in"
      - "Add CI: tests and build on every pull request, weekly lychee link check"
      - Deploy to Cloudflare and point learn.sankettambare.in at it
      - Write the week 1 log in the hub (checkpoint, day 7)
    build_links:
      - { label: Astro docs, url: "https://docs.astro.build" }
      - { label: Supabase row-level security, url: "https://supabase.com/docs/guides/database/postgres/row-level-security" }
      - { label: lychee-action, url: "https://github.com/lycheeverse/lychee-action" }
      - { label: Cloudflare static assets, url: "https://developers.cloudflare.com/workers/static-assets/" }
  - id: w2
    number: 2
    short: W2
    start: 8
    end: 14
    title: Prompting, outputs, embeddings, evals
    learn: Prompting, structured outputs, embeddings, evals methodology; start cost logging
    build: "Core 1: audit the portfolio RAG, label a 40–50 question eval set"
    build_sub: "Label each question: factual, multi-hop, not in corpus, adversarial. Log tokens and cost per request."
    interview: Design patterns (strategy, factory, observer, adapter); DSA two pointers, sliding window
    dsa: two pointers and sliding window
    project: core-1
    build_steps:
      - "Map the current \"Ask Sanket\" pipeline: chunking, embedding model, vector store, prompt, LLM"
      - Log tokens, latency and cost for every request (cost logging starts this week)
      - Pull 15–20 real questions from logs, then write more to reach 40–50
      - "Label each question by type: factual, multi-hop, not in corpus, adversarial"
      - Write the expected answer and the source chunk for every question
      - Run v1 over the set and do error analysis on the failures before changing any code
      - Commit the eval set and the v1 baseline numbers (checkpoint, day 14)
    build_links:
      - { label: AI Evals FAQ, url: "https://hamel.dev/blog/posts/evals-faq/" }
      - { label: Prompt evaluations course, url: "https://github.com/anthropics/courses" }
      - { label: Instructor, url: "https://python.useinstructor.com" }
  - id: w3
    number: 3
    short: W3
    start: 15
    end: 21
    title: RAG core
    learn: Chunking, pgvector, hybrid BM25 + vector, reranking, query rewriting
    build: "Core 1: RAG v2, measured against v1"
    build_sub: Hybrid search with RRF fusion, cross-encoder reranking, then rerun the eval set
    interview: Load balancing, caching, replication, sharding
    dsa: stack
    project: core-1
    build_steps:
      - Add a full-text (tsvector) index next to the pgvector index
      - "Hybrid query: fuse keyword and vector results with reciprocal rank fusion (RRF) in SQL"
      - Add a cross-encoder reranker (bge-reranker on CPU) over the top 20–50 results
      - Rewrite vague or multi-part questions before retrieval
      - Hash each chunk so re-embedding only touches changed content
      - Rerun the eval set and compare v2 with v1 on recall@k and answer accuracy
    build_links:
      - { label: Supabase hybrid search, url: "https://supabase.com/docs/guides/ai/hybrid-search" }
      - { label: pgvector, url: "https://github.com/pgvector/pgvector" }
      - { label: bge-reranker-v2-m3, url: "https://huggingface.co/BAAI/bge-reranker-v2-m3" }
      - { label: RAG_Techniques (link only), url: "https://github.com/NirDiamant/RAG_Techniques" }
  - id: w4
    number: 4
    short: W4
    start: 22
    end: 28
    title: Advanced RAG + RAG evals
    learn: Contextual retrieval, citations, LLM-as-judge calibration; 3 h GraphRAG spike
    build: "Core 1: eval report on 3+ configurations, with claim-level checks"
    build_sub: Split answers into claims and verify each against its cited chunk
    interview: "GenAI drill: RAG over 10M documents with access control"
    dsa: heap
    project: core-1
    build_steps:
      - "Contextual retrieval: prepend a short context to each chunk before embedding and BM25"
      - Cite chunk ids in every answer; refuse when the answer is not in the corpus
      - "Claim-level checks: split each answer into claims and verify every claim against its cited chunk"
      - Calibrate the LLM judge against 30+ of your own labels; keep scores binary
      - Cache judge outputs by a hash of (input, output, judge prompt) to protect the budget
      - "Compare 3+ configurations: faithfulness, context precision and recall, p95 latency, cost per query"
      - Publish the eval report and ship Core 1 live (checkpoint, day 28)
      - "Optional: 3 h GraphRAG spike with neo4j-graphrag-python"
    build_links:
      - { label: Contextual Retrieval, url: "https://www.anthropic.com/engineering/contextual-retrieval" }
      - { label: LLM-as-a-Judge guide, url: "https://hamel.dev/notes/llm/evals/" }
      - { label: Ragas, url: "https://docs.ragas.io" }
      - { label: neo4j-graphrag-python, url: "https://github.com/neo4j/neo4j-graphrag-python" }
  - id: w5
    number: 5
    short: W5
    start: 29
    end: 35
    title: Agents, MCP, context engineering, security
    learn: Agents, tool design, MCP 2026-07-28, context engineering, prompt injection, tool permissions
    build: "Core 2: upgrade RunCoach AI with an MCP server and approval step"
    build_sub: "Map each tool to OWASP agentic risks: tool misuse, privilege abuse"
    interview: Queues, async, rate limiting, idempotency
    dsa: trees
    project: core-2
    build_steps:
      - "List the tools RunCoach needs: read runs, read the plan, propose a plan change, apply a change"
      - Build an MCP server for training data against the 2026-07-28 spec with the official Python SDK
      - Split read tools from write tools; every write waits for your approval
      - Add idempotency keys to every write and scope credentials per tool
      - "Map each tool to OWASP agentic risks (goal hijack, tool misuse, privilege abuse) and add a defence for each"
      - Red-team prompt injection through run notes and retrieved text
    build_links:
      - { label: MCP spec 2026-07-28, url: "https://blog.modelcontextprotocol.io/posts/2026-07-28/" }
      - { label: MCP reference servers, url: "https://github.com/modelcontextprotocol/servers" }
      - { label: Hugging Face MCP Course, url: "https://huggingface.co/learn/mcp-course" }
      - { label: OWASP Agentic Top 10, url: "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/" }
  - id: w6
    number: 6
    short: W6
    start: 36
    end: 42
    title: Frameworks, human-in-the-loop, tracing
    learn: Agent frameworks, human-in-the-loop, tracing, agent evals, multi-agent
    build: "Core 2: tracing, agent evals, cost per conversation"
    build_sub: Langfuse traces, trajectory evals, 2-minute demo video
    interview: "LLD: parking lot, rate limiter, LRU cache"
    dsa: graphs and BFS
    project: core-2
    build_steps:
      - Multi-step planning with LangGraph; an interrupt pauses for your approval before any change
      - "Trace every step in Langfuse: prompts, tool calls, tokens, cost, latency"
      - "Build an agent eval set: trajectories, tool choice and final answers"
      - Report cost per conversation and p95 latency
      - Record a 2-minute demo video (checkpoint, day 42)
    build_links:
      - { label: LangChain Academy (LangGraph), url: "https://github.com/langchain-ai/langchain-academy" }
      - { label: Langfuse docs, url: "https://langfuse.com/docs" }
      - { label: Evaluating AI Agents, url: "https://www.deeplearning.ai/courses/evaluating-ai-agents" }
  - id: w7
    number: 7
    short: W7
    start: 43
    end: 49
    title: Data + AI platform
    learn: Databricks deep (Vector Search, Mosaic AI Agent Framework, MLflow, Unity Catalog); Snowflake light (Cortex Analyst)
    build: "Core 3: document ingestion → lakehouse → RAG + text-to-SQL"
    build_sub: Start the Snowflake trial on day 43. Text-to-SQL accuracy on 20 questions.
    interview: "GenAI drill: enterprise assistant with access control"
    dsa: intervals
    project: core-3
    build_steps:
      - Parse the E20 and Dividend Question PDFs and reports with Docling
      - Extract typed JSON with a confidence score (Instructor + Pydantic); send low-confidence rows to review
      - Land raw, parsed and extracted data as Delta tables in Unity Catalog
      - Add Databricks Vector Search over the chunks (Free Edition allows one endpoint)
      - Start the Snowflake trial on day 43 and build a Cortex Analyst semantic model
      - "Text-to-SQL: compare the semantic model with a hand-written schema prompt on 20 questions"
      - Draw the architecture diagram and write the README (checkpoint, day 49)
    build_links:
      - { label: Docling, url: "https://github.com/docling-project/docling" }
      - { label: Databricks Free Edition limits, url: "https://docs.databricks.com/aws/en/getting-started/free-edition-limitations" }
      - { label: Cortex Analyst quickstart, url: "https://github.com/Snowflake-Labs/sfguide-getting-started-with-cortex-analyst" }
      - { label: MLflow GenAI, url: "https://mlflow.org/docs/latest/genai/" }
  - id: w8
    number: 8
    short: W8
    start: 50
    end: 54
    title: LLMOps, security, cost
    learn: Routing, semantic cache, cost/latency budgets, inference basics, OWASP LLM and Agentic Top 10 2026
    build: "Core 4: LLM gateway, then load-test Core 1 or 2 through it"
    build_sub: Routing, fallbacks, semantic cache, budgets, PII redaction; k6 load test
    interview: "3 mocks: GenAI design, classic design, LLD"
    dsa: mixed review
    project: core-4
    build_steps:
      - Thin FastAPI gateway with one OpenAI-compatible endpoint in front of two or more providers
      - Routing and fallbacks, with timeouts and retries
      - Per-project budgets and a spend ledger; reject calls over budget
      - Semantic cache keyed on model, prompt version and user scope
      - Redact PII with Presidio before a request leaves the gateway
      - Cost dashboard; route Core 1 or Core 2 through the gateway
      - "k6 load test: p95 latency, time to first token, 429 behaviour (checkpoint, day 54)"
    build_links:
      - { label: LiteLLM (pin versions), url: "https://github.com/BerriAI/litellm" }
      - { label: Portkey gateway, url: "https://github.com/Portkey-AI/gateway" }
      - { label: Microsoft Presidio, url: "https://microsoft.github.io/presidio/" }
      - { label: Grafana k6, url: "https://grafana.com/docs/k6/latest/" }
  - id: race
    race: true
    event: Khadakwasla Ultra
    short: Race
    start: 55
    end: 56
    title: Rest + Khadakwasla Ultra
    learn: Rest
    build: "—"
    interview: Khadakwasla Ultra on day 56
  - id: final
    short: Final
    start: 57
    end: 60
    title: Final days
    learn: Light revision from your own hub notes
    build: Polish READMEs, demo videos, resume
    build_sub: README, architecture diagram, eval numbers and demo for all four projects
    interview: 4th mock (behavioural); STAR story bank of 8 stories
    build_steps:
      - Write each project's README with the 5-part template (Projects page)
      - Add an architecture diagram and before/after eval numbers to every README
      - Record a 2-minute demo video for each project
      - Update the resume and portfolio with links and numbers
      - Turn eval results into STAR stories; reach 8 by day 60
    build_links:
      - { label: Tech Interview Handbook, url: "https://www.techinterviewhandbook.org" }

