questions:
  - id: rag-10m-acl
    q: Design RAG over 10M documents with per-user access control.
    points:
      - Store ACLs as chunk metadata at ingestion; filter inside the vector query, not after it
      - Hybrid BM25 + vector retrieval, then rerank; cite chunks in the answer
      - Shard indexes by tenant; incremental re-embedding with a hash per chunk
      - Evaluate per tenant; budget embedding and query cost
  - id: rag-vs-long-context
    q: "RAG vs long context vs fine-tuning: when is each right?"
    points:
      - "Under ~200k tokens of stable content: long context with prompt caching"
      - "Large or changing corpus that needs citations: RAG"
      - "Narrow task needing format, style or lower latency: fine-tune"
      - "Often combined: RAG for facts, a small tuned model for format"
  - id: eval-rag
    q: How do you evaluate a RAG system, and how do you know your judge is right?
    points:
      - Start with error analysis on real traces
      - "Labelled set by type: factual, multi-hop, not in corpus, adversarial"
      - Score retrieval (recall@k) separately from answers (faithfulness)
      - Calibrate the judge on your own labels; binary scores; track agreement
  - id: safe-agent
    q: Design an agent that takes real actions safely.
    points:
      - Plan first, then human approval before any side effect
      - Least-privilege tools with scoped credentials
      - Idempotency keys on every write
      - Trace each step; cap steps, time and spend
  - id: mcp-vs-functions
    q: MCP vs plain function calling.
    points:
      - "Function calling: tools defined inside one app"
      - "MCP: a standard protocol, servers reusable across clients"
      - "2026-07-28 spec: stateless core, no session handshake"
      - Large tool catalogues bloat context; load tools on demand
  - id: cut-cost-60
    q: Cut LLM cost by 60% without losing quality.
    points:
      - Measure cost per request first
      - Prompt caching and batch APIs
      - Route easy queries to smaller models
      - Semantic cache and tighter context
  - id: prompt-injection
    q: Prompt-injection defences for tool-using agents.
    points:
      - Treat all tool output and retrieved text as untrusted data
      - "Split privileges: a reading agent cannot write"
      - Allow-lists and approval for risky actions
      - Map controls to OWASP LLM and Agentic Top 10
  - id: semantic-cache
    q: "Semantic cache: what to cache, and how to invalidate it."
    points:
      - Match on embedding similarity with a strict threshold
      - Key on model, prompt version and user scope
      - TTL plus invalidation when source documents change
      - Skip personalised and tool-using answers
  - id: llm-gateway
    q: Multi-tenant LLM gateway with per-team budgets.
    points:
      - Auth → tenant → budget check → route → provider
      - Per-team budgets, rate limits and a spend ledger
      - Fallbacks and retries with timeouts
      - PII redaction, logging and a cost dashboard
  - id: text-to-sql
    q: "Text-to-SQL: accuracy and safety."
    points:
      - Semantic model or a curated schema prompt
      - Read-only role, row limits, allow-listed tables
      - Validate SQL before running it
      - Measure accuracy on a fixed question set
  - id: observability
    q: "Observability: what goes in a trace, and which SLOs?"
    points:
      - Prompt, retrieved chunks, tool calls, tokens, cost, latency
      - "SLOs: p95 latency, time to first token, error rate, cost per request"
      - Online evals on sampled traffic
      - Link traces back to eval datasets
  - id: streaming-latency
    q: "Latency budget for streaming chat: time to first token vs total time."
    points:
      - Time to first token drives perceived speed
      - "Split the budget: retrieval, rerank, first token, stream"
      - Parallelise retrieval, cache, use smaller rerankers
      - Track p95, not averages

